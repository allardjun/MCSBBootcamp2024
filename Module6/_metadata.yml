# Document metadata shared by every notebook in this directory.
#
# Unlike _quarto.yml this is merged into each document as defaults, so a notebook can still override any of it in its own YAML.

# Render math at build time rather than shipping it to MathJax.
# Quarto's MathJax emits no assistive MathML and no role="math", so a screen reader gets silence where the equations are, and it loads from a CDN at runtime, so a self-contained page still needs the network to show its own math.
html-math-method: mathml

# Figures generated by executed {python} chunks are vector wherever the format can carry one.
#
# Matplotlib's default through the jupyter engine is a raster png, which loses the axis text to pixels at any zoom. A generated figure can be either, so it should never be a png.
format:
  html:
    fig-format: svg
  ipynb:
    fig-format: svg
